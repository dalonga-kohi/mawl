<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
<defs>
  <clipPath id="tile"><rect width="1024" height="1024" rx="228"/></clipPath>
  <linearGradient id="bg" x1="0.2" y1="0" x2="0.8" y2="1"><stop offset="0" stop-color="#1b1d19"/><stop offset="1" stop-color="#050605"/></linearGradient>
  <radialGradient id="glow" cx="0.5" cy="0.62" r="0.5"><stop offset="0" stop-color="#cfe86a" stop-opacity="0.34"/><stop offset="1" stop-color="#cfe86a" stop-opacity="0"/></radialGradient>
  <linearGradient id="body" x1="0.25" y1="0" x2="0.65" y2="1"><stop offset="0" stop-color="#e4f09a"/><stop offset="1" stop-color="#bfd45e"/></linearGradient>
  <linearGradient id="tail" x1="0" y1="0" x2="0.6" y2="1"><stop offset="0" stop-color="#a4bc48"/><stop offset="1" stop-color="#869b36"/></linearGradient>
  <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.1"/><stop offset="0.5" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="18.9"/></filter>
</defs>
<g clip-path="url(#tile)">
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>
  <rect width="1024" height="1024" fill="url(#gloss)"/>
  <!-- confetti behind the head -->
  <g fill="#f6d66b" opacity="0.95">
    <path transform="translate(196 262) scale(7)" d="M0 -6 Q0.8 -0.8 6 0 Q0.8 0.8 0 6 Q-0.8 0.8 -6 0 Q-0.8 -0.8 0 -6 Z"/>
    <path transform="translate(836 196) scale(5.2)" d="M0 -6 Q0.8 -0.8 6 0 Q0.8 0.8 0 6 Q-0.8 0.8 -6 0 Q-0.8 -0.8 0 -6 Z"/>
    <path transform="translate(868 392) scale(3.4)" d="M0 -6 Q0.8 -0.8 6 0 Q0.8 0.8 0 6 Q-0.8 0.8 -6 0 Q-0.8 -0.8 0 -6 Z"/>
  </g>
  <g transform="translate(508 857.4) scale(8.6) rotate(-8 0 14)">
    <!-- ground shadow from the body onto the glow -->
    <ellipse cx="0" cy="26" rx="52" ry="12" fill="#26301a" opacity="0.35" filter="url(#soft)"/>
    <ellipse cx="46" cy="-14" rx="12" ry="20" fill="url(#tail)" transform="rotate(28 46 -14)"/>
    <circle cx="-29" cy="-33" r="10" fill="#d2e47a"/><circle cx="29" cy="-33" r="10" fill="#d2e47a"/>
    <circle cx="-29" cy="-34" r="5.5" fill="#a8be4a"/><circle cx="29" cy="-34" r="5.5" fill="#a8be4a"/>
    <path d="M-48 20 C-48 -20 -28 -44 0 -44 C28 -44 48 -20 48 20 C48 36 36 42 0 42 C-36 42 -48 36 -48 20 Z" fill="url(#body)"/>
    <!-- mochi sheen -->
    <ellipse cx="-17" cy="-28" rx="17" ry="7" fill="url(#shine)" transform="rotate(-22 -17 -28)"/>
    <g fill="#ff9aa8" opacity="0.5"><ellipse cx="-29" cy="10" rx="6.5" ry="3.8"/><ellipse cx="29" cy="10" rx="6.5" ry="3.8"/></g>
    <path d="M-13 -7 L-13 1 M13 -7 L13 1" stroke="#26301a" stroke-width="6.4" stroke-linecap="round" fill="none"/>
    <path d="M-6.5 9 Q0 15 6.5 9" stroke="#26301a" stroke-width="2.8" stroke-linecap="round" fill="none"/>
  </g>
</g>
<rect x="2" y="2" width="1020" height="1020" rx="226" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="4"/>
</svg>