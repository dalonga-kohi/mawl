<title>Mawl Mockup</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650&family=Figtree:wght@400;450;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout concept: "lodge by the river" — quiet airy app window (rail · teammates · conversation · computer panel) floating over a soft river wave; one memorable element: Pip the beaver. */
:root{
  --bg:#F5F7FA; --surface:#FFFFFF; --surface-2:#EEF2F6; --line:#E1E6EC;
  --text:#17202B; --text-2:#5A6675; --text-3:#8A95A3;
  --stage:#E9EFF6; --stage-wave:#DCE7F3;
  --ok:#2F9E68; --warn:#B87410; --danger:#D4443C;
  --accent:#3D8BFD; --accent-fill:#2B6FE6; --accent-ink:#2B6FE6; --on-accent:#FFFFFF;
  --accent-soft:color-mix(in oklab, var(--accent) 14%, var(--surface));
  --accent-softer:color-mix(in oklab, var(--accent) 7%, var(--surface));
  --accent-ring:color-mix(in oklab, var(--accent) 45%, transparent);
  --ok-soft:color-mix(in oklab, var(--ok) 13%, var(--surface));
  --warn-soft:color-mix(in oklab, var(--warn) 14%, var(--surface));
  --danger-soft:color-mix(in oklab, var(--danger) 12%, var(--surface));
  --fur:#8B5E3C; --fur-light:#B07D52; --tail:#5B3D28; --tooth:#FFF7E6; --nose:#2A1E16; --blush:#F2A38F; --log:#C89A6A;
  --screen-bg:#DDE4EC; --screen-win:#FFFFFF;
  --shadow-1:0 1px 2px rgb(16 24 40 / .05);
  --shadow-2:0 10px 30px -10px rgb(16 24 40 / .18);
  --shadow-win:0 30px 80px -30px rgb(23 32 43 / .35);
  --win-border:transparent;
  --font-ui:'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-display:'Bricolage Grotesque', 'Figtree', system-ui, sans-serif;
  --font-mono:'JetBrains Mono', ui-monospace, 'Cascadia Code', Consolas, monospace;
  --r-xs:6px; --r-sm:10px; --r-md:14px; --r-lg:20px; --r-xl:28px;
  --spring-gentle:linear(0, 0.3 9%, 0.72 21%, 0.94 34%, 1.012 46%, 1.006 62%, 1);
  --spring-bouncy:linear(0, 0.42 10%, 1.09 26%, 0.97 40%, 1.012 54%, 0.998 70%, 1);
  --dur-fast:120ms; --dur-base:200ms; --dur-slow:320ms;
  --ease-out:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F141A; --surface:#161C24; --surface-2:#1D2530; --line:#26303C;
  --text:#E8EDF3; --text-2:#A3AEBB; --text-3:#6E7A88;
  --stage:#0B0F14; --stage-wave:#121A24;
  --ok:#4CC08A; --warn:#E5A43B; --danger:#F07A72;
  --screen-bg:#202A36; --screen-win:#E9EEF4;
  --shadow-win:0 30px 80px -30px rgb(0 0 0 / .7); --win-border:#26303C;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0F141A; --surface:#161C24; --surface-2:#1D2530; --line:#26303C;
  --text:#E8EDF3; --text-2:#A3AEBB; --text-3:#6E7A88;
  --stage:#0B0F14; --stage-wave:#121A24;
  --ok:#4CC08A; --warn:#E5A43B; --danger:#F07A72;
  --screen-bg:#202A36; --screen-win:#E9EEF4;
  --shadow-win:0 30px 80px -30px rgb(0 0 0 / .7); --win-border:#26303C;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--stage);color:var(--text);font-family:var(--font-ui);font-size:15px;line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0 32px;
  transition:background-color var(--dur-slow) var(--ease-out), color var(--dur-slow) var(--ease-out);overflow-x:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--accent-ring);outline-offset:2px;border-radius:var(--r-xs)}
.icon{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}

/* ---------- river backdrop ---------- */
.river{position:fixed;inset:auto 0 0 0;height:46vh;z-index:-1;pointer-events:none}
.river svg{width:100%;height:100%;display:block}
.river path{fill:var(--stage-wave);transition:fill var(--dur-slow)}
.river path.w2{fill:var(--accent-softer);opacity:.7}

/* ---------- mockup toolbar ---------- */
.toolbar{max-width:1320px;margin:0 auto;padding-block:18px 14px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px}
.brand .wordmark{font-family:var(--font-display);font-weight:650;font-size:22px;letter-spacing:-.01em}
.brand small{color:var(--text-2);font-size:13px}
.tb-controls{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.seg{display:inline-flex;background:var(--surface);border-radius:999px;padding:3px;box-shadow:var(--shadow-1);position:relative;border:1px solid var(--win-border)}
.seg button{position:relative;z-index:1;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:550;color:var(--text-2);display:inline-flex;gap:6px;align-items:center;min-height:32px;transition:color var(--dur-base)}
.seg button[aria-pressed="true"]{color:var(--text)}
.seg .thumb{position:absolute;top:3px;bottom:3px;border-radius:999px;background:var(--surface-2);transition:left var(--dur-slow) var(--spring-gentle), width var(--dur-slow) var(--spring-gentle)}
.swatches{display:flex;gap:6px;align-items:center;background:var(--surface);padding:5px 8px;border-radius:999px;box-shadow:var(--shadow-1);border:1px solid var(--win-border)}
.sw{width:22px;height:22px;border-radius:999px;background:var(--c);position:relative;transition:transform var(--dur-base) var(--spring-bouncy)}
.sw:hover{transform:scale(1.12)}
.sw:active{transform:scale(.92)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--c)}
.sw.custom{background:conic-gradient(from 0deg,#EF6F5E,#E09A1E,#3FA36B,#3D8BFD,#8E6BE8,#EF6F5E)}
.sw.custom input{position:absolute;inset:0;opacity:0;cursor:pointer}

/* ---------- stage ---------- */
.stage{max-width:1320px;margin:0 auto}
.window{background:var(--bg);border-radius:var(--r-xl);box-shadow:var(--shadow-win);border:1px solid var(--win-border);overflow:hidden;height:min(800px, calc(100vh - 110px));min-height:640px;display:grid;grid-template-columns:68px 290px minmax(0,1fr) 360px;grid-template-rows:minmax(0,1fr);transition:background-color var(--dur-slow)}
.window > *{min-height:0}
.window.no-list{grid-template-columns:68px minmax(0,1fr)}
.window.no-panel{grid-template-columns:68px 290px minmax(0,1fr)}

/* rail */
.rail{background:var(--surface);display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 0;border-right:1px solid var(--line)}
.rail .mascot-slot{width:48px;height:48px;margin-bottom:10px;display:grid;place-items:center;border-radius:var(--r-md);background:var(--accent-softer);transition:background var(--dur-slow)}
.rail-btn{width:44px;height:44px;border-radius:var(--r-sm);display:grid;place-items:center;color:var(--text-2);position:relative;transition:background var(--dur-fast), color var(--dur-fast), transform var(--dur-fast)}
.rail-btn:hover{background:var(--surface-2);color:var(--text)}
.rail-btn:active{transform:scale(.94)}
.rail-btn[aria-current="page"]{background:var(--accent-soft);color:var(--accent-ink)}
.rail-btn .icon{width:20px;height:20px}
.rail-btn .badge{position:absolute;top:5px;right:4px;min-width:17px;height:17px;padding:0 4px;border-radius:999px;background:var(--accent-fill);color:var(--on-accent);font-size:11px;font-weight:700;display:grid;place-items:center;font-variant-numeric:tabular-nums;animation:pop var(--dur-slow) var(--spring-bouncy)}
.rail .spacer{flex:1}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}

/* teammate list */
.list{background:var(--surface-2);display:flex;flex-direction:column;min-width:0;border-right:1px solid var(--line)}
.list-head{padding:18px 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.list-head h2{font-size:17px;font-weight:650}
.icon-btn{width:34px;height:34px;border-radius:var(--r-sm);display:grid;place-items:center;color:var(--text-2);transition:background var(--dur-fast), transform var(--dur-fast)}
.icon-btn:hover{background:var(--surface);color:var(--text)}
.icon-btn:active{transform:scale(.93)}
.search{margin:0 12px 10px;display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:var(--r-sm);padding:0 10px;height:38px;color:var(--text-3)}
.search input{border:0;background:none;outline:none;flex:1;min-width:0;color:var(--text)}
.search input::placeholder{color:var(--text-3)}
.mates{list-style:none;margin:0;padding:0 8px 12px;overflow:auto;display:flex;flex-direction:column;gap:2px}
.mate{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px;border-radius:var(--r-md);text-align:left;width:100%;transition:background var(--dur-fast), transform var(--dur-fast)}
.mate:hover{background:color-mix(in oklab, var(--surface) 60%, transparent)}
.mate:active{transform:scale(.985)}
.mate[aria-current="true"]{background:var(--surface);box-shadow:var(--shadow-1)}
.avatar{width:42px;height:42px;border-radius:var(--r-sm);background:color-mix(in oklab, var(--tint) 22%, var(--surface));display:grid;place-items:center;position:relative}
.avatar svg{width:34px;height:34px}
.status-dot{position:absolute;right:-3px;bottom:-3px;width:13px;height:13px;border-radius:999px;border:2.5px solid var(--surface-2);background:var(--text-3)}
.mate[aria-current="true"] .status-dot{border-color:var(--surface)}
.status-dot.working{background:var(--ok)}
.status-dot.waiting{background:var(--warn)}
.status-dot.working::after{content:"";position:absolute;inset:-4px;border-radius:999px;border:2px solid var(--ok);opacity:0;animation:ping 2.2s var(--ease-out) infinite}
@keyframes ping{0%{transform:scale(.6);opacity:.7}100%{transform:scale(1.5);opacity:0}}
.mate-name{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mate-line{font-size:13px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mate-line.live{color:var(--accent-ink)}
.mate-meta{display:flex;flex-direction:column;align-items:flex-end;gap:5px;font-size:12px;color:var(--text-3);font-variant-numeric:tabular-nums}
.pill{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--accent-fill);color:var(--on-accent);font-size:11.5px;font-weight:700;display:grid;place-items:center}
.pill.warn{background:var(--warn-soft);color:var(--warn)}

/* conversation */
.convo{display:flex;flex-direction:column;min-width:0;background:var(--bg)}
.convo-head{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);min-height:68px}
.convo-head .who{min-width:0;flex:1}
.convo-head h1{font-size:16.5px;font-weight:650}
.convo-head .sub{font-size:13px;color:var(--text-2);display:flex;align-items:center;gap:6px}
.live-dot{width:7px;height:7px;border-radius:99px;background:var(--ok);animation:breathe 2s ease-in-out infinite}
@keyframes breathe{50%{opacity:.35}}
.btn{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px;border-radius:var(--r-sm);font-weight:600;font-size:14px;transition:background var(--dur-fast), transform var(--dur-fast) , box-shadow var(--dur-fast)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent-fill);color:var(--on-accent)}
.btn.primary:hover{background:color-mix(in oklab, var(--accent-fill) 88%, black)}
.btn.soft{background:var(--surface-2);color:var(--text)}
.btn.soft:hover{background:color-mix(in oklab, var(--surface-2) 80%, var(--text) 8%)}
.btn.ghost{color:var(--text-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--text)}
.btn.sm{height:32px;padding:0 11px;font-size:13px}
.thread{flex:1;overflow:auto;padding:24px 24px 12px;display:flex;flex-direction:column;gap:18px;scroll-behavior:smooth}
.thread > *{max-width:68ch;width:100%}
.day{align-self:center;font-size:12px;color:var(--text-3);font-weight:550}
.msg{animation:msgIn var(--dur-slow) var(--spring-gentle) both}
@keyframes msgIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.msg.user{align-self:flex-end;background:var(--accent-soft);padding:10px 14px;border-radius:var(--r-md) var(--r-md) 6px var(--r-md);max-width:min(52ch, 85%)}
.msg.bot{align-self:flex-start;display:flex;flex-direction:column;gap:10px}
.msg.bot p{color:var(--text)}
.msg ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.msg .time{font-size:11.5px;color:var(--text-3);margin-top:4px}
.msg.user .time{text-align:right}
.caret{display:inline-block;width:7px;height:15px;margin-left:2px;border-radius:2px;background:var(--accent);vertical-align:-2px;animation:breathe 1s ease-in-out infinite}

/* tool activity */
.tool{border-radius:var(--r-md);background:var(--surface);box-shadow:var(--shadow-1);border:1px solid var(--win-border);overflow:hidden;max-width:60ch}
.tool-sum{display:flex;align-items:center;gap:10px;padding:10px 12px;width:100%;text-align:left;transition:background var(--dur-fast)}
.tool-sum:hover{background:var(--accent-softer)}
.tool-ico{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--ok-soft);color:var(--ok);flex:none}
.tool-ico .icon{width:15px;height:15px;stroke-width:2.4}
.tool-ico.run{background:var(--accent-soft);color:var(--accent-ink)}
.tool-ico.run .spin{width:14px;height:14px;border-radius:99px;border:2px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(1turn)}}
.tool-ico.done-pop{animation:pop var(--dur-slow) var(--spring-bouncy)}
.tool-title{flex:1;font-weight:550;font-size:14px;min-width:0}
.tool-dur{font-size:12px;color:var(--text-3);font-variant-numeric:tabular-nums}
.chev{transition:transform var(--dur-base) var(--spring-gentle);color:var(--text-3)}
.tool[data-open="true"] .chev{transform:rotate(180deg)}
.tool-steps{display:grid;grid-template-rows:0fr;transition:grid-template-rows var(--dur-slow) var(--spring-gentle)}
.tool[data-open="true"] .tool-steps{grid-template-rows:1fr}
.tool-steps > div{overflow:hidden}
.tool-steps ol{margin:0;padding:2px 14px 12px 48px;display:flex;flex-direction:column;gap:6px;font-size:13.5px;color:var(--text-2)}
.tool-steps code{font-family:var(--font-mono);font-size:12px;background:var(--surface-2);padding:1px 5px;border-radius:5px;color:var(--text)}
.shimmer{height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent);background-size:40% 100%;background-repeat:no-repeat;animation:shim 1.3s linear infinite}
@keyframes shim{from{background-position:-40% 0}to{background-position:140% 0}}

/* approval */
.approval{border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-1);padding:14px;display:flex;flex-direction:column;gap:10px;max-width:60ch;transition:opacity var(--dur-base), transform var(--dur-slow) var(--spring-gentle)}
.approval-head{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--warn)}
.approval h3{font-size:15px;font-weight:600}
.quote{font-size:14px;color:var(--text-2);border-left:3px solid var(--line);padding:2px 0 2px 12px}
.approval .row{display:flex;flex-wrap:wrap;gap:8px}
.resolved{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ok);font-weight:550;animation:msgIn var(--dur-slow) var(--spring-gentle) both}
.resolved.denied{color:var(--text-2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:999px;background:var(--surface-2);color:var(--text-2);font-size:12.5px;font-weight:550;transition:background var(--dur-fast), transform var(--dur-fast)}
.chip:hover{background:var(--accent-soft);color:var(--accent-ink)}
.chip:active{transform:scale(.96)}
.chip .icon{width:14px;height:14px}

/* composer */
.composer-wrap{padding:10px 20px 18px}
.composer{max-width:76ch;margin:0 auto;background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow-1), 0 0 0 1px var(--line);padding:10px 10px 10px 14px;display:flex;align-items:flex-end;gap:8px;transition:box-shadow var(--dur-base)}
.composer:focus-within{box-shadow:0 0 0 2px var(--accent-ring)}
.composer textarea{flex:1;border:0;outline:none;background:none;resize:none;min-height:24px;max-height:140px;padding:6px 0;line-height:1.5}
.composer textarea::placeholder{color:var(--text-3)}
.model-chip{height:32px;padding:0 10px;border-radius:999px;background:var(--surface-2);font-size:12.5px;font-weight:550;color:var(--text-2);display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.send{width:36px;height:36px;border-radius:12px;background:var(--accent-fill);color:var(--on-accent);display:grid;place-items:center;transition:transform var(--dur-fast), opacity var(--dur-base)}
.send:active{transform:scale(.9)}
.send:disabled{opacity:.45;cursor:default}
.hint{max-width:76ch;margin:6px auto 0;font-size:12px;color:var(--text-3);text-align:center}

/* context panel */
.panel{background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.tabs{display:flex;gap:4px;padding:14px 14px 0;position:relative}
.tab{flex:1;height:34px;border-radius:var(--r-sm);font-size:13px;font-weight:600;color:var(--text-2);transition:color var(--dur-base), background var(--dur-fast)}
.tab:hover{background:var(--surface-2)}
.tab[aria-selected="true"]{color:var(--text);background:var(--surface-2)}
.panel-body{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:14px}
.section-title{font-size:13px;font-weight:650;color:var(--text-2);display:flex;justify-content:space-between;align-items:center}

/* computer screen */
.screen{position:relative;aspect-ratio:16/10;max-width:100%;border-radius:var(--r-md);background:var(--screen-bg);overflow:hidden;transition:box-shadow var(--dur-slow) var(--spring-gentle)}
.screen.control{box-shadow:0 0 0 3px var(--accent)}
.screen .live-tag{position:absolute;top:8px;left:8px;z-index:3;display:flex;align-items:center;gap:6px;background:rgb(15 20 26 / .72);color:#fff;font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px}
.screen .live-tag .live-dot{background:#4CC08A}
.vm-taskbar{position:absolute;inset:auto 0 0 0;height:9%;background:rgb(15 20 26 / .55)}
.vm-win{position:absolute;left:7%;top:9%;width:86%;height:76%;background:var(--screen-win);border-radius:6px;box-shadow:0 6px 18px rgb(0 0 0 / .18);overflow:hidden;display:flex;flex-direction:column}
.vm-bar{height:12%;background:#D5DCE4;display:flex;align-items:center;gap:4px;padding:0 6px}
.vm-bar i{width:5px;height:5px;border-radius:9px;background:#9AA6B3}
.vm-url{flex:1;height:58%;margin-left:6px;border-radius:4px;background:#F4F6F9;font:500 7px/1 var(--font-ui);color:#5A6675;display:flex;align-items:center;padding-left:6px}
.vm-body{flex:1;display:grid;grid-template-columns:24% 1fr;gap:4%;padding:5%}
.vm-side span,.vm-row{display:block;height:7px;border-radius:3px;background:#DEE4EB;margin-bottom:7px}
.vm-row{height:11px;margin-bottom:6px;transition:background var(--dur-slow), opacity var(--dur-slow), transform var(--dur-slow)}
.vm-row.hl{background:color-mix(in oklab, var(--accent) 30%, #FFFFFF)}
.vm-row.gone{opacity:0;transform:translateX(12px)}
.ghost-cursor{position:absolute;z-index:2;width:18px;height:18px;left:60%;top:45%;transition:left .9s var(--spring-gentle), top .9s var(--spring-gentle)}
.ghost-cursor svg{width:18px;height:18px;filter:drop-shadow(0 2px 3px rgb(0 0 0 / .3))}
.ghost-cursor .tag{position:absolute;left:16px;top:14px;white-space:nowrap;background:var(--accent-fill);color:var(--on-accent);font-size:10px;font-weight:650;padding:2px 7px;border-radius:999px}
.screen.control .ghost-cursor{opacity:0}
.lease{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--accent-soft);color:var(--accent-ink);border-radius:var(--r-sm);padding:8px 12px;font-size:13px;font-weight:600;animation:msgIn var(--dur-slow) var(--spring-gentle)}
.lease time{font-variant-numeric:tabular-nums}
.screen-actions{display:flex;flex-wrap:wrap;gap:8px}

/* context meter (memory budget) */
.meter-card{background:var(--surface-2);border-radius:var(--r-md);padding:12px;display:flex;flex-direction:column;gap:8px}
.meter{position:relative;height:8px;border-radius:99px;background:var(--line)}
.meter .fill{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--accent);transition:width var(--dur-slow) var(--spring-gentle)}
.meter .mark{position:absolute;top:-3px;bottom:-3px;width:2px;border-radius:2px;background:var(--text-3)}
.meter-legend{display:flex;justify-content:space-between;font-size:12px;color:var(--text-2);font-variant-numeric:tabular-nums}
.ladder{display:flex;gap:6px;flex-wrap:wrap;font-size:11.5px;color:var(--text-2)}
.ladder span{background:var(--surface);padding:2px 8px;border-radius:999px}

/* pages */
.page{overflow:auto;padding:28px clamp(16px, 4vw, 48px) 40px;display:flex;flex-direction:column;gap:22px;min-width:0}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.page-head h1{font-family:var(--font-display);font-size:30px;font-weight:650;letter-spacing:-.015em}
.page-head p{color:var(--text-2);margin-top:4px}
.group-label{font-size:13px;font-weight:650;color:var(--text-2);margin-bottom:-10px}
.card{background:var(--surface);border-radius:var(--r-lg);border:1px solid var(--win-border);box-shadow:var(--shadow-1);padding:18px}
.grid-2{display:grid;grid-template-columns:repeat(auto-fit, minmax(min(100%, 300px), 1fr));gap:14px}
.block-card h3{font-size:14.5px;font-weight:650;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.block-card h3 small{font-weight:500;color:var(--text-3);font-size:12px;font-variant-numeric:tabular-nums}
.block-card p{font-size:13.5px;color:var(--text-2);margin:10px 0 12px}
.fact{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:12px 4px;border-top:1px solid var(--line);align-items:center}
.fact:first-child{border-top:0}
.fact .t{font-size:14px}
.fact .m{font-size:12px;color:var(--text-3);margin-top:2px}
.fact.expired .t{color:var(--text-3);text-decoration:line-through}
.tagx{font-size:11.5px;font-weight:650;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--text-2);white-space:nowrap}
.tagx.ok{background:var(--ok-soft);color:var(--ok)}
.overnight{display:flex;gap:14px;align-items:center;background:var(--accent-softer);border-radius:var(--r-lg);padding:14px 18px}
.overnight p{font-size:14px;color:var(--text-2)}
.overnight strong{color:var(--text)}
.routine{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 4px;border-top:1px solid var(--line)}
.routine:first-child{border-top:0}
.routine .ri{width:40px;height:40px;border-radius:var(--r-sm);background:var(--accent-softer);color:var(--accent-ink);display:grid;place-items:center}
.routine h3{font-size:14.5px;font-weight:600}
.routine p{font-size:13px;color:var(--text-2)}
.toggle{width:42px;height:26px;border-radius:999px;background:var(--line);position:relative;transition:background var(--dur-base);flex:none}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:99px;background:var(--surface);box-shadow:0 1px 3px rgb(0 0 0 / .2);transition:transform var(--dur-slow) var(--spring-bouncy)}
.toggle[aria-checked="true"]{background:var(--accent-fill)}
.toggle[aria-checked="true"]::after{transform:translateX(16px)}
.nl-input{display:flex;gap:8px;align-items:center;background:var(--surface);border-radius:var(--r-md);padding:6px 6px 6px 14px;box-shadow:0 0 0 1px var(--line)}
.nl-input:focus-within{box-shadow:0 0 0 2px var(--accent-ring)}
.nl-input input{flex:1;border:0;outline:none;background:none;min-width:0;height:36px}
.parsed{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--text-2);padding:2px 4px}
.parsed b{color:var(--text);font-weight:600;background:var(--surface-2);padding:2px 8px;border-radius:999px}

.appr-row:first-child{border-top:0}
.setting{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.setting:first-of-type{border-top:0}
.setting h3{font-size:14.5px;font-weight:600}
.setting p{font-size:13px;color:var(--text-2)}
.big-swatches{display:flex;gap:10px;flex-wrap:wrap}
.big-swatches .sw{width:32px;height:32px}
.qr{width:132px;height:132px;display:grid;grid-template-columns:repeat(21,1fr);gap:0;padding:8px;background:#FFFFFF;border-radius:var(--r-sm);box-shadow:0 0 0 1px var(--line)}
.qr i{background:#17202B;aspect-ratio:1}
.qr i.o{background:transparent}
.provider{display:flex;align-items:center;gap:10px}
.prov-logo{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--surface-2);font-weight:700;font-size:13px}

/* empty */
.empty{flex:1;display:grid;place-items:center;text-align:center;padding:24px}
.empty h2{font-family:var(--font-display);font-size:24px;font-weight:650;margin-top:8px}
.empty p{color:var(--text-2);margin:6px auto 14px;max-width:40ch}

/* ---------- beaver ---------- */
.beaver{overflow:visible}
.beaver .bob{animation:bob 3.6s ease-in-out infinite;transform-origin:60px 100px}
@keyframes bob{50%{transform:translateY(-1.6px)}}
.beaver .eyes-open{animation:blink 5.5s infinite;transform-origin:60px 46px}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96.5%{transform:scaleY(.08)}}
.beaver .eyes-closed,.beaver .zz,.beaver .logbits,.beaver .sign,.beaver .think,.beaver .sweat,.beaver .sparkle{opacity:0;transition:opacity var(--dur-base)}
.beaver .pupils{transition:transform var(--dur-slow) var(--spring-gentle)}
.beaver .tailg{transform-origin:84px 98px;transition:transform var(--dur-slow) var(--spring-bouncy)}
.beaver .ears{transition:transform var(--dur-slow) var(--spring-bouncy);transform-origin:60px 40px}
.beaver .head{transition:transform var(--dur-slow) var(--spring-gentle);transform-origin:60px 70px}
.beaver[data-state="listening"] .ears{transform:translateY(-2px) scale(1.04)}
.beaver[data-state="listening"] .head{transform:rotate(-6deg)}
.beaver[data-state="thinking"] .pupils{transform:translate(1.5px,-2.2px)}
.beaver[data-state="thinking"] .think{opacity:1;animation:breathe 1.2s infinite}
.beaver[data-state="working"] .logbits{opacity:1}
.beaver[data-state="working"] .head{animation:gnaw .32s ease-in-out infinite}
@keyframes gnaw{50%{transform:translateY(1.5px) rotate(1deg)}}
.beaver[data-state="working"] .chipbit{animation:chip 1s ease-out infinite}
.beaver[data-state="working"] .chipbit:nth-child(2){animation-delay:.33s}
.beaver[data-state="working"] .chipbit:nth-child(3){animation-delay:.66s}
@keyframes chip{0%{transform:translate(0,0);opacity:1}100%{transform:translate(var(--dx),-10px);opacity:0}}
.beaver[data-state="waiting"] .sign{opacity:1}
.beaver[data-state="waiting"] .head{animation:tilt 2.4s ease-in-out infinite}
@keyframes tilt{50%{transform:rotate(4deg)}}
.beaver[data-state="done"] .tailg{animation:slap .7s var(--spring-bouncy) 2}
@keyframes slap{40%{transform:rotate(-28deg)}}
.beaver[data-state="done"] .sparkle{opacity:1;animation:pop .5s var(--spring-bouncy)}
.beaver[data-state="sleeping"] .eyes-open{opacity:0;animation:none}
.beaver[data-state="sleeping"] .eyes-closed{opacity:1}
.beaver[data-state="sleeping"] .zz{opacity:1}
.beaver[data-state="sleeping"] .zz text{animation:zz 2.6s ease-in-out infinite}
.beaver[data-state="sleeping"] .zz text:nth-child(2){animation-delay:.9s}
@keyframes zz{0%{opacity:0;transform:translate(0,4px)}40%{opacity:1}100%{opacity:0;transform:translate(6px,-8px)}}
.beaver[data-state="sleeping"] .bob{animation-duration:5s}
.beaver[data-state="error"] .ears{transform:translateY(3px) rotate(0deg)}
.beaver[data-state="error"] .sweat{opacity:1}
.beaver[data-state="error"] .pupils{transform:translateY(1.5px)}

/* ---------- onboarding ---------- */
.onb{position:relative;height:100%;display:grid;grid-template-rows:auto 1fr;background:var(--bg);overflow:hidden}
.onb-top{display:flex;justify-content:space-between;align-items:center;padding:20px 28px}
.dots{display:flex;gap:8px}
.dots i{width:8px;height:8px;border-radius:99px;background:var(--line);transition:width var(--dur-slow) var(--spring-gentle), background var(--dur-slow)}
.dots i.on{width:24px;background:var(--accent)}
.onb-stage{display:grid;place-items:center;padding:0 24px 160px;position:relative;z-index:1}
.onb-step{width:min(520px, 100%);display:flex;flex-direction:column;align-items:center;text-align:center;gap:16px;animation:stepIn var(--dur-slow) var(--spring-gentle) both}
@keyframes stepIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.onb-step h1{font-family:var(--font-display);font-size:clamp(28px, 4vw, 40px);font-weight:650;letter-spacing:-.02em;line-height:1.08}
.onb-step > p{color:var(--text-2);max-width:42ch}
.field{width:100%;display:flex;flex-direction:column;gap:6px;text-align:left}
.field label{font-size:13px;font-weight:600;color:var(--text-2)}
.field input{height:44px;border-radius:var(--r-sm);border:0;background:var(--surface);box-shadow:0 0 0 1px var(--line);padding:0 14px;outline:none;transition:box-shadow var(--dur-fast)}
.field input:focus{box-shadow:0 0 0 2px var(--accent-ring)}
.field .help{font-size:12.5px;color:var(--text-3)}
.prov-grid{display:grid;grid-template-columns:repeat(2, minmax(0,1fr));gap:8px;width:100%}
.prov-opt{display:flex;align-items:center;gap:10px;padding:12px;border-radius:var(--r-md);background:var(--surface);box-shadow:0 0 0 1px var(--line);text-align:left;transition:box-shadow var(--dur-fast), transform var(--dur-fast)}
.prov-opt:active{transform:scale(.98)}
.prov-opt[aria-pressed="true"]{box-shadow:0 0 0 2px var(--accent)}
.prov-opt small{display:block;color:var(--text-3);font-size:12px}
.onb-wave{position:absolute;inset:auto 0 0 0;height:180px;pointer-events:none}
.onb-wave svg{width:200%;height:100%;display:block;transition:transform .9s var(--spring-gentle)}
.onb-wave path.a{fill:var(--accent);opacity:.85}
.onb-wave path.b{fill:var(--accent-soft)}

.sheet{position:absolute;inset:auto 0 0 0;background:var(--surface);border-radius:28px 28px 0 0;box-shadow:0 -10px 40px -10px rgb(0 0 0 / .25);padding:10px 18px 28px;display:flex;flex-direction:column;gap:12px;transform:translateY(105%);transition:transform var(--dur-slow) var(--spring-gentle);z-index:5}
.sheet.open{transform:none}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);align-self:center}

.state-picker{display:flex;flex-wrap:wrap;gap:6px}
.state-picker .chip[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-ink)}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom, 0px));transform:translate(-50%, calc(100% + 48px));visibility:hidden;background:var(--text);color:var(--bg);padding:10px 16px 10px 12px;border-radius:999px;display:flex;align-items:center;gap:8px;font-size:14px;font-weight:550;box-shadow:var(--shadow-2);transition:transform var(--dur-slow) var(--spring-gentle), visibility 0s linear var(--dur-slow);z-index:50;max-width:calc(100vw - 32px)}
.toast.show{transition-delay:0s}
.toast.show{transform:translate(-50%,0);visibility:visible}

}

}

/* ---------------- accent engine ---------------- */
const PRESETS = [['Lake','#3D8BFD'],['Moss','#3FA36B'],['Amber','#E09A1E'],['Coral','#EF6F5E'],['Plum','#8E6BE8'],['Slate','#5B6B82']];
const hexToRgb = h => [1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const rgbToHex = c => '#'+c.map(v=>Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,'0')).join('').toUpperCase();
const lum = c => { const [r,g,b]=c.map(v=>{v/=255;return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4)}); return .2126*r+.7152*g+.0722*b; };
const contrast = (a,b) => { const x=lum(a),y=lum(b); return (Math.max(x,y)+.05)/(Math.min(x,y)+.05); };
const mix = (c,t,p) => c.map((v,i)=>v+(t[i]-v)*p);
function shadeUntil(base, against, target, toward){ let c=base; for(let p=0;p<=1.0001;p+=0.02){ c=mix(base,toward,p); if(contrast(c,against)>=target) return c; } return c; }
const state = { accent:'#3D8BFD', theme:'system', mode:'desktop', view:'chat', mate:0, panelTab:'computer', reduce:false, control:false };
const mq = window.matchMedia('(prefers-color-scheme: dark)');
const isDark = () => state.theme==='dark' || (state.theme==='system' && mq.matches);
function applyAccent(hex){
  state.accent = hex;
  const root = document.documentElement, base = hexToRgb(hex), white=[255,255,255], black=[0,0,0];
  const dark = isDark(); const surface = dark ? hexToRgb('#161C24') : hexToRgb('#FFFFFF');
  let accent = base;
  if(dark && contrast(base, surface) < 4.5) accent = shadeUntil(base, surface, 4.5, white);
  let fill = base, on = white;
  if(contrast(base, white) < 4.5){
    const ink = hexToRgb('#17202B');
    if(contrast(base, ink) >= 6) { on = ink; }
    else fill = shadeUntil(base, white, 4.5, black);
  }
  const accentInk = dark ? shadeUntil(base, surface, 4.5, white) : shadeUntil(base, surface, 4.5, black);
  root.style.setProperty('--accent', rgbToHex(accent));
  root.style.setProperty('--accent-fill', rgbToHex(fill));
  root.style.setProperty('--on-accent', rgbToHex(on));
  root.style.setProperty('--accent-ink', rgbToHex(accentInk));
  document.querySelectorAll('[data-sw]').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.sw.toUpperCase()===hex.toUpperCase())));
  try{ localStorage.setItem('mawl-accent', hex); }catch(e){}
}

   + `<label class="sw custom" title="Custom color"><span class="sr">Custom accent color</span><input type="color" id="custom-${big?'big':'tb'}" value="#3D8BFD" data-custom></label>`;
}

    <div class="group-label">Yesterday</div><div class="card">${[[MATES[2],'Added 3 competitors to the pricing table','18:20'],[MATES[3],'Opened a PR that bumps 12 dependencies','16:02']].map(([m,t,tm])=>`<div class="fact"><div style="display:flex;gap:12px;align-items:center;min-width:0">${mateAvatar(m,34)}<div style="min-width:0"><div class="t">${t}</div><div class="m">${m.name}</div></div></div><span class="tagx">${tm}</span></div>`).join('')}</div></section>`;
  if(state.view==='memory') return `<section class="page"><div class="page-head"><div><h1>Memory</h1><p>What ${MATES[0].name} remembers. Edit anything; your edits always win.</p></div><button class="btn soft sm" data-toast="Exported MEMORY.md and USER.md">Export</button></div>
    <div class="overnight">${beaverSVG(44,'done')}<p><strong>Overnight, Pip tidied up:</strong> merged 3 duplicate facts, retired 1 outdated one, and shortened your profile block. <button class="btn ghost sm" data-toast="Overnight changes undone">${ic('undo')}Undo</button></p></div>
    <div class="group-label">Always in mind</div>
    <div class="grid-2">${[['About you',812,1500,'Works in Warsaw time. Prefers short, warm replies. Never send on weekends.'],['Projects',1240,2000,'Acme renewal (Nora Lind), Q4 pricing review, Mawl beta.'],['Current task',612,1500,'Weekday sweep. Archive noise, draft client replies.'],['Note to future self',1980,2500,'Nora usually replies within 2 hours. Check the order form before Friday.']].map(([t,a,b,p])=>`<div class="card block-card"><h3>${t}<small>${a.toLocaleString('en')} / ${b.toLocaleString('en')}</small></h3><p>${p}</p><div class="meter"><span class="fill" style="width:${Math.round(a/b*100)}%;${a/b>.75?'background:var(--warn)':''}"></span></div></div>`).join('')}</div>
    <div class="group-label">Facts</div>
    <div class="card">
      <div class="fact"><div><div class="t">The Acme renewal covers 2 new seats from Nov 1</div><div class="m">Since Oct 15 · from "Q4 renewal" thread · used 3 times</div></div><span class="tagx ok">current</span></div>
      <div class="fact"><div><div class="t">Reply tone: short, warm, no exclamation marks</div><div class="m">Pinned by you · Sep 12</div></div><span class="tagx">pinned</span></div>
      <div class="fact expired"><div><div class="t">The Acme renewal is for 10 seats</div><div class="m">Valid Aug 2 to Oct 15 · replaced by a newer fact</div></div><span class="tagx">past</span></div>
    </div></section>`;
  if(state.view==='routines') return `<section class="page"><div class="page-head"><div><h1>Routines</h1><p>Work that happens on its own. Results arrive where you choose.</p></div></div>
    <form class="nl-input" id="nlForm"><label for="nl" class="sr">Describe a routine</label>${ic('sparkle')}<input id="nl" value="Every weekday at 7, sweep my inbox and send me a summary on Telegram"><button class="btn primary sm" type="submit">Create</button></form>
    <div class="parsed" id="parsed">Understood as <b>Mon to Fri, 07:00 Warsaw</b> <b>Inbox Sweeper</b> <b>Summary to Telegram</b></div>
    <div class="card">${[
      ['mail','Morning sweep','Inbox Sweeper · weekdays at 07:00 · next tomorrow 07:00',true],
      ['globe','Price watch','Market Scout · every 6 hours · next at 12:00',true],
      ['heart','Heartbeat','Home Admin · checks its list every 30 minutes, stays quiet unless needed',true],
      ['clock','Weekly review','Code Gardener · Sundays at 18:00 · paused',false]
    ].map(([i,t,p,on],n)=>`<div class="routine"><span class="ri">${ic(i)}</span><div style="min-width:0"><h3>${t}</h3><p>${p}</p></div><button class="toggle" role="switch" aria-checked="${on}" aria-label="${t} on" id="rt-${n}"></button></div>`).join('')}</div></section>`;
  if(state.view==='settings') return `<section class="page"><div class="page-head"><div><h1>Settings</h1><p>Make Mawl yours.</p></div></div>
    <div class="group-label">Appearance</div>
    <div class="card"><div class="setting"><div><h3>Accent color</h3><p>Tints buttons, selection and highlights. Pip stays brown.</p></div><div class="big-swatches" data-swatches-big>${swatchHTML(true)}</div></div>
      <div class="setting"><div><h3>Reduce motion</h3><p>Swap springs and the mascot's animations for simple fades.</p></div><button class="toggle" role="switch" aria-checked="${state.reduce}" id="reduceToggle" aria-label="Reduce motion"></button></div></div>
    <div class="group-label">Models</div>
    <div class="card"><div class="setting"><div class="provider"><span class="prov-logo">A</span><div><h3>Anthropic</h3><p>Main: Claude Sonnet · Helper: Claude Haiku</p></div></div><span class="tagx ok">connected</span></div>
      <div class="setting"><div class="provider"><span class="prov-logo">O</span><div><h3>Ollama on this machine</h3><p>Found llama3.3 and nomic-embed-text</p></div></div><span class="tagx ok">connected</span></div></div>
    <div class="group-label">Phone and chat apps</div>
    <div class="card"><div class="setting" style="align-items:flex-start"><div style="max-width:42ch"><h3>Pair your phone</h3><p>Scan with the Mawl app. Works on your home network, or anywhere with Tailscale. The code expires in 5 minutes.</p></div><div class="qr" aria-label="Pairing code (sample)">${qr()}</div></div>
      <div class="setting"><div><h3>Telegram</h3><p>@pip_inbox_bot · only you can talk to it</p></div><span class="tagx ok">connected</span></div>
      <div class="setting"><div><h3>Discord</h3><p>Not connected</p></div><button class="btn soft sm" data-toast="Paste a bot token to connect Discord">${ic('plug')}Connect</button></div></div></section>`;
  return '';
}
function qr(){ let s=''; let seed=7; const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280;};
  for(let y=0;y<21;y++)for(let x=0;x<21;x++){ const f=(a,b)=>x>=a&&x<a+7&&y>=b&&y<b+7; let on;
    const inF=f(0,0)||f(14,0)||f(0,14); if(inF){ const lx=(x%14)%7, ly=(y%14)%7; const ox = x>=14?x-14:x, oy=y>=14?y-14:y; const a=ox, b=oy; on = (a===0||a===6||b===0||b===6)||(a>=2&&a<=4&&b>=2&&b<=4);} else on = rnd()>.52;
    s+=`<i class="${on?'':'o'}"></i>`; } return s; }

function onboarding(step){
  const steps = [
    `<div class="onb-step">${beaverSVG(150,'idle','')}<h1>Meet Pip. Pip builds things while you're away.</h1><p>Mawl gives you teammates that run on your own machine, with your own model. Setup takes about three minutes.</p><button class="btn primary" data-onb="1">Get started</button></div>`,
    `<div class="onb-step">${beaverSVG(96,'listening')}<h1>Connect a model</h1><p>Your key stays on this machine. You can add more providers later.</p>
      <div class="prov-grid">${[['Anthropic','Claude'],['OpenAI','GPT'],['OpenRouter','Many models'],['Ollama','Found on this machine']].map(([n,s],i)=>`<button class="prov-opt" aria-pressed="${i===0}" data-prov><span class="prov-logo">${n[0]}</span><span><b>${n}</b><small>${s}</small></span></button>`).join('')}</div>
      <div class="field"><label for="apikey">API key</label><input id="apikey" type="password" autocomplete="off" placeholder="Paste your key"><span class="help">We check it with one small request.</span></div>
      <button class="btn primary" data-onb="2">Check and continue</button></div>`,
    `<div class="onb-step">${beaverSVG(96,'thinking')}<h1>Name your first teammate</h1><p>Give it a job in a sentence. You can change everything later.</p>
      <div class="field"><label for="tname">Name</label><input id="tname" value="Inbox Sweeper"></div>
      <div class="field"><label for="tjob">What should it do?</label><input id="tjob" value="Keep my inbox calm and draft replies for me to approve"></div>
      <div class="chips" style="justify-content:center">${['Research assistant','Home admin','Code gardener'].map(s=>`<button class="chip">${s}</button>`).join('')}</div>
      <button class="btn primary" data-onb="3">Create teammate</button></div>`,
    `<div class="onb-step">${beaverSVG(96,'done')}<h1>Take it with you</h1><p>Scan with the Mawl app to chat, approve and watch from your phone.</p><div class="qr" aria-label="Pairing code (sample)">${qr()}</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center"><button class="btn primary" data-onb-done>Open Mawl</button><button class="btn ghost" data-onb-done>Skip for now</button></div></div>`
  ];
  return `<div class="window no-list" style="grid-template-columns:minmax(0,1fr)"><section class="onb"><div class="onb-top"><span class="dots" aria-label="Step ${step+1} of 4">${[0,1,2,3].map(i=>`<i class="${i===step?'on':''}"></i>`).join('')}</span>${step>0?`<button class="btn ghost sm" data-onb="${step-1}">Back</button>`:'<span></span>'}</div>
    <div class="onb-stage">${steps[step]}</div>
    <div class="onb-wave" aria-hidden="true"><svg viewBox="0 0 2880 180" preserveAspectRatio="none" style="transform:translateX(-${step*12}%)"><path class="b" d="M0 70 C 240 20 480 120 720 70 S 1200 20 1440 70 S 1920 120 2160 70 S 2640 20 2880 70 V180 H0Z"/><path class="a" d="M0 110 C 240 60 480 160 720 110 S 1200 60 1440 110 S 1920 160 2160 110 S 2640 60 2880 110 V180 H0Z"/></svg></div>
  </section></div>`;
}

      <div class="p-island" aria-hidden="true"></div>
      <div class="p-status"><span>9:41</span><span style="display:flex;gap:6px">${ic('globe')}</span></div>
      <div class="p-head">${mateAvatar(MATES[0],38)}<div style="flex:1;min-width:0"><h2>Inbox Sweeper</h2><div class="sub"><span class="live-dot"></span>Working</div></div><button class="icon-btn" aria-label="Watch the computer" data-sheet>${ic('monitor')}</button></div>
      <div class="p-thread">

        ${approvalsState.nora==='pending'?`<div class="approval"><div class="approval-head">${ic('hand')}Waiting for you</div><h3>Send this reply to Nora Lind?</h3><div class="row"><button class="btn primary sm" data-approve="nora">Approve</button><button class="btn soft sm" data-deny="nora">Don't send</button></div></div>`:`<div class="resolved">${ic('check')}Approved from your phone</div>`}
      </div>

      <nav class="p-tabs" aria-label="Phone tabs">

        <button class="p-tab">${ic('activity')}Activity</button>
        <button class="p-tab center" aria-label="Quick ask"><span class="bubble">${beaverSVG(44,'working','')}</span></button>
        <button class="p-tab">${ic('checkCircle')}Approvals</button>
        <button class="p-tab">${ic('sliders')}Settings</button>
      </nav>
      <div class="sheet" id="sheet"><span class="grab"></span><div class="section-title"><span>Inbox Sweeper's computer</span><button class="icon-btn" aria-label="Close" data-sheet>${ic('x')}</button></div>
        <div class="screen p-thumb"><span class="live-tag"><span class="live-dot"></span>Live</span><div class="vm-win"><div class="vm-bar"><i></i><i></i><i></i><span class="vm-url">mail.google.com</span></div><div class="vm-body"><div class="vm-side"><span></span><span></span></div><div>${'<span class="vm-row"></span>'.repeat(5)}</div></div></div><div class="vm-taskbar"></div></div>
        <div class="screen-actions"><button class="btn primary sm" data-toast="On the phone, touch becomes the mouse">${ic('hand')}Take control</button><button class="btn soft sm">${ic('key')}Type a password</button></div></div>
    </div>
    <div class="phone-notes"><h2>Pip, in every state</h2><p>Tap a state to see the mascot react. The final art will come from the illustration brief in DESIGN.md. This beaver is a placeholder.</p>
      <div style="display:grid;place-items:center;background:var(--surface);border-radius:var(--r-lg);padding:18px;border:1px solid var(--win-border)">${beaverSVG(150,'idle','')}</div>
      <div class="state-picker">${['idle','listening','thinking','working','waiting','done','sleeping','error'].map((s,i)=>`<button class="chip" data-beaver-state="${s}" aria-pressed="${i===0}">${s}</button>`).join('')}</div>
    </div>
  </div>`;

/* ---------------- render ---------------- */
let onbStep = 0, leaseTimer=null, leaseStart=0, ghostTimer=null;
const stage = document.getElementById('stage');
function render(){
  clearInterval(ghostTimer);
  if(state.mode==='onboarding'){ stage.innerHTML = onboarding(onbStep); }
  else if(state.mode==='phone'){ stage.innerHTML = phone(); }
  else {
    const isChat = state.view==='chat';
    const cls = isChat ? '' : 'no-list';
    stage.innerHTML = `<div class="window ${cls} ${isChat && state.hidePanel ? 'no-panel':''}">${rail()}${isChat ? list()+convo()+(state.hidePanel?'':panel()) : page()}</div>`;
    const firstBeaver = stage.querySelector('.mascot-slot .beaver'); if(firstBeaver) firstBeaver.setAttribute('data-mascot-main','');
    if(isChat && state.panelTab==='computer' && !state.hidePanel) startGhost();
    if(state.control) startLease();
  }
  hydrateIcons(stage); hydrateBeavers(stage); hydrateBeavers(document.querySelector('.toolbar')); hydrateBeavers(document.getElementById('toast'));
  document.querySelectorAll('[data-swatches]').forEach(el=>{ if(!el.dataset.ready){ el.innerHTML = swatchHTML(false); el.dataset.ready='1'; }});
  applyAccent(state.accent);
  const t = stage.querySelector('#thread'); if(t) t.scrollTop = t.scrollHeight;
}
function startGhost(){
  const pts=[[62,44],[48,58],[70,36],[55,66],[66,50]]; let i=0;
  ghostTimer = setInterval(()=>{ const g=document.getElementById('ghost'); if(!g) return; const [x,y]=pts[i++%pts.length]; g.style.left=x+'%'; g.style.top=y+'%';
    const rows=document.querySelectorAll('#vmRows .vm-row'); rows.forEach((r,n)=>r.classList.toggle('hl', n===(i%rows.length))); }, 1700);
}
function startLease(){
  clearInterval(leaseTimer); if(!leaseStart) leaseStart=Date.now();
  leaseTimer = setInterval(()=>{ const el=document.getElementById('leaseTime'); if(!el){clearInterval(leaseTimer);return;} const s=Math.floor((Date.now()-leaseStart)/1000); el.textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; },1000);
}
function toast(msg){ const t=document.getElementById('toast'); document.getElementById('toastText').textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),2600); }
function moveThumb(seg){ const on=seg.querySelector('button[aria-pressed="true"]'); const th=seg.querySelector('.thumb'); if(on&&th){ th.style.left=on.offsetLeft+'px'; th.style.width=on.offsetWidth+'px'; } }

/* ---------------- fake streaming reply ---------------- */
function sendMessage(text){
  const thread=document.getElementById('thread'); if(!thread) return;
  const u=document.createElement('div'); u.className='msg user'; u.innerHTML=`<p></p><div class="time">now</div>`; u.querySelector('p').textContent=text; thread.appendChild(u);
  setMascot('thinking');
  const b=document.createElement('div'); b.className='msg bot';
  b.innerHTML=`<div class="tool" data-open="false"><button class="tool-sum" aria-expanded="false" data-tool><span class="tool-ico run"><span class="spin"></span></span><span class="tool-title">Searching memory and inbox</span><span class="tool-dur">…</span>${ic('down','chev')}</button><div class="shimmer"></div><div class="tool-steps"><div><ol><li>Recalled 3 memories</li><li>Searched 214 threads</li></ol></div></div></div><p class="stream"></p>`;
  setTimeout(()=>{ thread.appendChild(b); thread.scrollTop=thread.scrollHeight; setMascot('working'); },500);
  setTimeout(()=>{ const ico=b.querySelector('.tool-ico'); ico.className='tool-ico done-pop'; ico.innerHTML=ic('check'); b.querySelector('.shimmer').remove(); b.querySelector('.tool-dur').textContent='4s'; b.querySelector('.tool-title').textContent='Searched memory and 214 threads';
    const reply='Sure. I found 3 related threads from last month. I will draft a short summary and park it with the others, so nothing goes out without you.';
    const p=b.querySelector('.stream'); let i=0; const caret='<span class="caret"></span>';
    const iv=setInterval(()=>{ i+=3; p.innerHTML = reply.slice(0,i).replace(/[<>&]/g,'')+caret; thread.scrollTop=thread.scrollHeight; if(i>=reply.length){ clearInterval(iv); p.textContent=reply; setMascot('done'); setTimeout(()=>setMascot('idle'),1800);} }, 28);
  },2100);
}

/* ---------------- events ---------------- */
document.addEventListener('click', e=>{
  const t = e.target.closest('button, [data-tool]'); if(!t) return;
  if(t.dataset.mode){ state.mode=t.dataset.mode; onbStep=0; document.querySelectorAll('#viewSeg button').forEach(b=>b.setAttribute('aria-pressed', String(b===t))); moveThumb(document.getElementById('viewSeg')); render(); return; }
  if(t.dataset.themeSet){ state.theme=t.dataset.themeSet; if(state.theme==='system') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', state.theme);
    document.querySelectorAll('#themeSeg button').forEach(b=>b.setAttribute('aria-pressed', String(b===t))); moveThumb(document.getElementById('themeSeg')); applyAccent(state.accent); return; }
  if(t.dataset.sw){ applyAccent(t.dataset.sw); const name=PRESETS.find(p=>p[1]===t.dataset.sw); toast(`Accent set to ${name?name[0]:'custom'}`); return; }
  if(t.dataset.view){ state.view=t.dataset.view; state.mode='desktop'; render(); return; }
  if(t.dataset.mate){ state.mate=+t.dataset.mate; render(); return; }
  if(t.dataset.tab){ state.panelTab=t.dataset.tab; render(); return; }
  if(t.dataset.panel){ state.panelTab=t.dataset.panel; state.hidePanel=false; render(); return; }
  if(t.hasAttribute('data-toggle-panel')){ state.hidePanel=!state.hidePanel; render(); return; }
  if(t.hasAttribute('data-tool')){ const card=t.closest('.tool'); const open=card.dataset.open!=='true'; card.dataset.open=String(open); t.setAttribute('aria-expanded', String(open)); return; }
  if(t.dataset.approve){ approvalsState[t.dataset.approve]='approved'; if(t.dataset.approve==='nora'){ setMascot('done'); setTimeout(()=>setMascot('idle'),1800); } toast(t.dataset.approve==='bill'?'Opening the computer so you can pay':'Approved. Sent to Nora Lind'); render(); return; }
  if(t.dataset.deny){ approvalsState[t.dataset.deny]='denied'; toast('Okay, nothing was sent'); render(); return; }
  if(t.dataset.control){ state.control = t.dataset.control==='on'; if(state.control){ leaseStart=Date.now(); setMascot('waiting'); toast('You have control. Inbox Sweeper paused.'); } else { clearInterval(leaseTimer); leaseStart=0; setMascot('working'); toast('Control returned. Inbox Sweeper resumes.'); } render(); return; }
  if(t.dataset.toast){ toast(t.dataset.toast); return; }
  if(t.dataset.onb!==undefined){ onbStep=+t.dataset.onb; render(); return; }
  if(t.hasAttribute('data-onb-done')){ state.mode='desktop'; document.querySelectorAll('#viewSeg button').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.mode==='desktop'))); moveThumb(document.getElementById('viewSeg')); render(); toast('Inbox Sweeper is ready'); return; }
  if(t.hasAttribute('data-prov')){ t.parentElement.querySelectorAll('[data-prov]').forEach(b=>b.setAttribute('aria-pressed', String(b===t))); return; }
  if(t.dataset.beaverState){ const s=t.dataset.beaverState; t.parentElement.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed', String(b===t))); const bv=document.querySelector('.phone-notes .beaver'); if(bv) bv.setAttribute('data-state', s); return; }
  if(t.hasAttribute('data-sheet')){ document.getElementById('sheet').classList.toggle('open'); return; }
  if(t.classList.contains('toggle')){ const on=t.getAttribute('aria-checked')!=='true'; t.setAttribute('aria-checked', String(on)); if(t.id==='reduceToggle'){ state.reduce=on; document.documentElement.classList.toggle('reduce', on); toast(on?'Motion reduced':'Motion restored'); } return; }
});
document.addEventListener('input', e=>{
  const el=e.target;
  if(el.matches('[data-custom]')) applyAccent(el.value.toUpperCase());
  if(el.id==='composer-input'){ el.style.height='auto'; el.style.height=Math.min(el.scrollHeight,140)+'px'; const send=el.form.querySelector('.send'); send.disabled = !el.value.trim(); setMascot(el.value.trim()?'listening':'idle'); }
  if(el.id==='nl'){ const v=el.value.toLowerCase(); const p=document.getElementById('parsed'); if(!p) return;
    const when = /weekday/.test(v)?'Mon to Fri':/sunday/.test(v)?'Sundays':/hour/.test(v)?'Every few hours':'Every day';
    const at = (v.match(/at (\d{1,2})(?::(\d{2}))?/)||[]); const time = at[1]?`${String(at[1]).padStart(2,'0')}:${at[2]||'00'} Warsaw`:'time not set';
    const ch = /telegram/.test(v)?'Summary to Telegram':/discord/.test(v)?'Summary to Discord':'Summary in the app';
    p.innerHTML = `Understood as <b>${when}, ${time}</b> <b>Inbox Sweeper</b> <b>${ch}</b>`; }
});
document.addEventListener('change', e=>{ if(e.target.matches('[data-custom]')) toast('Custom accent applied'); });
document.addEventListener('submit', e=>{
  e.preventDefault();
  if(e.target.id==='composer'){ const ta=e.target.querySelector('textarea'); const v=ta.value.trim(); if(!v) return; ta.value=''; ta.style.height='auto'; e.target.querySelector('.send').disabled=true; sendMessage(v); }
  if(e.target.id==='nlForm'){ toast('Routine created. First run tomorrow at 07:00'); }
});
document.addEventListener('keydown', e=>{ if(e.target.id==='composer-input' && e.key==='Enter' && !e.shiftKey){ e.preventDefault(); e.target.form.requestSubmit(); } });
mq.addEventListener && mq.addEventListener('change', ()=>applyAccent(state.accent));
window.addEventListener('resize', ()=>{ moveThumb(document.getElementById('viewSeg')); moveThumb(document.getElementById('themeSeg')); });

/* ---------------- boot ---------------- */
try{ const a=localStorage.getItem('mawl-accent'); if(a && /^#[0-9a-f]{6}$/i.test(a)) state.accent=a; }catch(e){}
if(window.innerWidth < 640){ state.mode='phone'; document.querySelectorAll('#viewSeg button').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.mode==='phone'))); }
hydrateIcons(document); render();
requestAnimationFrame(()=>{ moveThumb(document.getElementById('viewSeg')); moveThumb(document.getElementById('themeSeg')); });
if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>{ moveThumb(document.getElementById('viewSeg')); moveThumb(document.getElementById('themeSeg')); });
})();
</script>
