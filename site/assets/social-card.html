<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>Mawl social preview artwork</title><style>@font-face{font-family:Bricolage;src:url('./fonts/bricolage-grotesque-latin-variable.woff2');font-weight:200 800}@font-face{font-family:Figtree;src:url('./fonts/figtree-latin-variable.woff2');font-weight:300 900}:root{--ink:#101016;--paper:#f1eddf;--lime:#d6ea95;--pink:#f0aec6;--mochi-shade:#8f9d70}*{box-sizing:border-box}body{position:relative;margin:0;width:1200px;height:630px;background:var(--ink);color:var(--paper);overflow:hidden;font-family:Figtree,Arial,sans-serif}.copy{position:absolute;left:62px;top:52px;width:550px;z-index:2}.brand{font-family:Bricolage,Arial,sans-serif;font-size:46px;font-weight:750;letter-spacing:-3px}.brand span{color:#bda4ed;font-size:30px;margin-left:13px}.intro{margin:56px 0 22px;font-size:17px;color:#bda4ed}h1{font-family:Bricolage,Arial,sans-serif;font-size:99px;line-height:.98;font-weight:650;letter-spacing:-6px;margin:0}p{font-size:19px;line-height:1.5;margin-top:28px;color:#aaa5b6;max-width:430px}small{display:block;margin-top:24px;color:#aaa5b6;font-size:13px}.scene{position:absolute;width:610px;height:610px;right:0;top:8px}.art{width:100%;height:100%}.mascot{position:absolute;left:55%;top:56%;width:20%}.mascot svg{display:block;width:100%;height:auto}</style></head><body><div class="copy"><div class="brand">mawl<span>✳</span></div><div class="intro">AI teammates for work and imagination.</div><h1>Your work.<br>In motion.</h1><p>Automate the routine.<br>Make room for the creative.</p><small>Open source. Built for your machine. mawl.tech</small></div><div class="scene"><img class="art" src="./night-studio.webp" width="610" height="610" alt="Moonlit rooftop studio"><div class="mascot"><svg class="hero-mochi" viewBox="0 0 180 160" aria-hidden="true">
