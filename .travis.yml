# Docker-backed suites only. GitHub Actions (.github/workflows/ci.yml) runs lint, typecheck, the
# other tests and the browser e2e, and skips these suites (MAWL_SKIP_DOCKER_SUITES), so nothing
# runs twice. scripts/travis-config.test.ts checks the shape of this file.
os: linux
dist: noble
language: node_js
# No node_js key: Travis's nvm reads the version from .nvmrc.

# Pushes to main and pull requests only; slice branches build through their PR.
if: branch = main OR type = pull_request

services:
  - docker

env:
  global:
    - CI=1
    # The Testcontainers suites must run here, never skip.
    - MAWL_REQUIRE_DOCKER=1
    - COREPACK_ENABLE_DOWNLOAD_PROMPT=0

cache:
  directories:
    - $HOME/.pnpm-store

# The pnpm version comes from "packageManager" in package.json.
before_install:
  - corepack enable
  - pnpm config set store-dir "$HOME/.pnpm-store"

install:
  - pnpm install --frozen-lockfile

jobs:
  include:
    - name: docker suites
      script:
        - pnpm test:docker
        # Builds the server image (about a minute); kept out of the default gate, so it runs here.
        - pnpm test:compose
