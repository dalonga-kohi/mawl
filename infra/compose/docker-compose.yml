# Mawl v1: the server (API, web app, Claude Code) and its Postgres.
#   cp infra/compose/.env.example infra/compose/.env   # then set MAWL_DB_PASSWORD
#   docker compose -f infra/compose/docker-compose.yml up -d --build
# Open http://localhost:7420. See docs/RUNNING.md.
name: mawl

services:
  db:
    image: pgvector/pgvector:0.8.7-pg17
    environment:
      POSTGRES_USER: mawl
      POSTGRES_DB: mawl
      POSTGRES_PASSWORD: ${MAWL_DB_PASSWORD:?set MAWL_DB_PASSWORD in infra/compose/.env}
    volumes:
      - mawl-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mawl -d mawl"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    # No published port: only the server reaches the database.

  server:
    image: mawl-server:local
    build:
      context: ../..
      dockerfile: infra/docker/server.Dockerfile
    environment:
      DATABASE_URL: postgres://mawl:${MAWL_DB_PASSWORD}@db:5432/mawl
      MAWL_ALLOWED_ORIGINS: ${MAWL_ALLOWED_ORIGINS:-}
      # Empty: the server generates the owner token into /secrets/owner-token on first start.
      MAWL_OWNER_TOKEN: ${MAWL_OWNER_TOKEN:-}
    ports:
      # Host loopback only: there is no device sign-in yet, so nothing else may reach the server.
      - "127.0.0.1:7420:7420"
      # Sign in with ChatGPT redirects the browser back to this port.
      - "127.0.0.1:1455:1455"
    volumes:
      - mawl-secrets:/secrets
      - mawl-claude:/claude
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    # A real PID 1 reaps the processes Claude Code spawns and forwards SIGTERM; 30 s lets runs wind down.
    init: true
    stop_grace_period: 30s

volumes:
  mawl-db:
  mawl-secrets:
  mawl-claude:
