name: pgvector (Windows)

# Builds pgvector for the embedded Postgres with MSVC and runs its regression suite (D1.2).
# Separate from ci.yml so the Linux gate stays fast; runs only when the inputs change.
on:
  push:
    branches: [main]
    paths:
      - infra/desktop/**
      - .github/workflows/pgvector-windows.yml
  pull_request:
    paths:
      - infra/desktop/**
      - .github/workflows/pgvector-windows.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pgvector-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pgvector:
    name: build and installcheck
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build pgvector with MSVC
        shell: pwsh
        run: ./infra/desktop/pgvector/build-vector-msvc.ps1 -Work "$env:RUNNER_TEMP\pgvector-work" -Out "$env:RUNNER_TEMP\pgvector-out"

      - name: Upload vector.dll, control, SQL and hashes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pgvector-0.8.7-pg17.10-win-x64
          path: ${{ runner.temp }}/pgvector-out
          if-no-files-found: error
