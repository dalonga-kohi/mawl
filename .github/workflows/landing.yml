name: Landing page

on:
  push:
    branches: [main]
    paths:
      - site/**
      - .github/workflows/landing.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: landing
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # Wrangler installs itself here, outside the pnpm workspace and the published files.
      - name: Prepare deployment tools
        working-directory: ${{ runner.temp }}
        run: |
          mkdir mawl-pages
          cd mawl-pages
          npm init --yes

      - name: Ensure project exists
        working-directory: ${{ runner.temp }}/mawl-pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          output="$(npx wrangler@4.152.0 pages project create mawl --production-branch=main 2>&1)"
          status=$?
          echo "$output"
          if [ "$status" -ne 0 ] && ! echo "$output" | grep -qi 'already exists'; then
            exit "$status"
          fi

      # Plain static files: nothing to build, upload site/ as is.
      - name: Deploy static site
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm
          workingDirectory: ${{ runner.temp }}/mawl-pages
          wranglerVersion: '4.152.0'
          command: pages deploy "${{ github.workspace }}/site" --project-name=mawl --branch=main
